[project]
name = "easy-bot-start"
version = "0.1.0"
description = "一个关于如何构建 Bot 的教程和样板代码"
authors = [{name = "微雨"}]
requires-python = ">=3.8"

dependencies = [
    "discord.py[speed]>=2.3.0",
    "aiohttp>=3.8.0",
    "sqlmodel",
    "aiosqlite",
    "python-dotenv",
    "aiohttp",
    "aiorun",
    "uvloop; sys_platform != 'win32'",
]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mike",
]
